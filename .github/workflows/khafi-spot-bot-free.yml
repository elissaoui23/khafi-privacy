name: Khafi Spot Bot Free Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khafi-spot-bot-free-keepalive
  cancel-in-progress: true

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake free Render bot and verify health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://khafi-spot-bot-testnet-ready.onrender.com/health"
          echo "Waking Render Frankfurt service..."
          response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$URL")"
          echo "$response"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True; assert d.get("mode") == "testnet"; print("Render Testnet health verified.")' "$response"

      - name: Safety note
        if: always()
        run: |
          echo "## Khafi Spot Bot — free architecture" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Actions only sends an HTTPS health request to the Render service." >> "$GITHUB_STEP_SUMMARY"
          echo "- Binance requests originate from the Frankfurt Render service, not from the GitHub runner." >> "$GITHUB_STEP_SUMMARY"
          echo "- Live/mainnet trading remains unavailable in the bot build." >> "$GITHUB_STEP_SUMMARY"

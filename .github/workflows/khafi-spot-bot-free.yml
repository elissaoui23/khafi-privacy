name: Khafi Spot Bot Free Testnet

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khafi-spot-bot-testnet
  cancel-in-progress: false

jobs:
  testnet-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      BOT_MODE: testnet
      EXECUTE_TESTNET_ORDERS: 'true'
      SYMBOLS: BTC/USDT,ETH/USDT,BNB/USDT
      ENTRY_SCORE: '78'
      MAX_QUOTE_PER_TRADE: '25'
      MIN_QUOTE_PER_TRADE: '5'
      MAX_CAPITAL_FRACTION_PER_TRADE: '0.20'
      RISK_CAPITAL: '100'
      MAX_DAILY_LOSS_PCT: '2.0'
      STOP_ATR_MULT: '1.5'
      TAKE_PROFIT_ATR_MULT: '2.5'
      TRAILING_ATR_MULT: '1.0'
      TRAILING_ACTIVATE_ATR: '1.0'
      MAX_HOLD_HOURS: '24'
      COOLDOWN_MINUTES: '45'

    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4
        with:
          ref: spot-bot-cloud
          path: code
          persist-credentials: false

      - name: Checkout persistent state
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state
          persist-credentials: true

      - name: Check Testnet secrets
        id: secretcheck
        shell: bash
        run: |
          if [ -n "$BINANCE_API_KEY" ] && [ -n "$BINANCE_API_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Binance Spot Testnet credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for repository secrets BINANCE_API_KEY and BINANCE_API_SECRET. No trading action was attempted."
          fi

      - name: Set up Python
        if: steps.secretcheck.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: code/trading_bot/requirements.txt

      - name: Install dependencies
        if: steps.secretcheck.outputs.ready == 'true'
        working-directory: code
        run: pip install -r trading_bot/requirements.txt

      - name: Run one safe Testnet cycle
        if: steps.secretcheck.outputs.ready == 'true'
        working-directory: code
        env:
          STATE_FILE: ${{ github.workspace }}/state/bot_state.json
        run: python trading_bot/run_once.py

      - name: Persist bot state
        if: always() && steps.secretcheck.outputs.ready == 'true'
        working-directory: state
        shell: bash
        run: |
          git config user.name "khafi-bot-state"
          git config user.email "khafi-bot-state@users.noreply.github.com"
          git add bot_state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "Update testnet bot state [skip ci]"
            git pull --rebase origin bot-state
            git push origin bot-state
          fi

      - name: Write safe summary
        if: always()
        shell: bash
        run: |
          echo "## Khafi Spot Bot — Binance Spot Testnet" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.secretcheck.outputs.ready }}" != "true" ]; then
            echo "Waiting for the two Binance Spot Testnet repository secrets. No order was attempted." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "state/bot_state.json" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path('state/bot_state.json').read_text())
          st = s.get('stats') or {}
          print(f"- Status: `{s.get('status')}`")
          print(f"- Closed trades: **{st.get('closed', 0)}**")
          print(f"- Wins / losses: **{st.get('wins', 0)} / {st.get('losses', 0)}**")
          print(f"- Realized Testnet PnL: **{float(s.get('realized_pnl_total') or 0):.6f} USDT**")
          print(f"- Open position: **{'yes' if s.get('position') else 'no'}**")
          print("- Safety boundary: **Binance Spot Testnet only**")
          PY
          fi
